<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode TUI + preview, in the tab</title>
  <style>
    html, body { height: 100%; margin: 0; background: #16161d; color: #a6a69c; font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    #left { position: relative; min-width: 0; min-height: 0; border-right: 1px solid #363646; }
    #terminal { position: absolute; inset: 0; overflow: hidden; }
    #terminal canvas { display: block; }
    #status { position: absolute; inset: 0; margin: 0; padding: 16px; white-space: pre-wrap; pointer-events: none; }
    #status.error { color: #e06c75; }
    #right { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fff; }
    #preview { flex: 1; min-height: 0; width: 100%; border: 0; background: #fff; }
    #log { flex: 0 0 auto; background: #16161d; border-top: 1px solid #363646; }
    #log summary { padding: 4px 8px; cursor: pointer; user-select: none; }
    #log pre { margin: 0; padding: 0 8px 8px; height: 30vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
    @media (max-width: 800px) { body { grid-template-columns: none; grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); } #left { border-right: 0; border-bottom: 1px solid #363646; } }
  </style>
</head>
<body>
  <div id="left"><div id="terminal"></div><pre id="status">Starting…</pre></div>
  <div id="right">
    <iframe id="preview" title="App preview"></iframe>
    <details id="log"><summary>OpenCode server output</summary><pre></pre></details>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
