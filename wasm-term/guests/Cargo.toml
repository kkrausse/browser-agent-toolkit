[workspace]
resolver = "2"
members = ["wasm-term-sys", "wasm-term-tokio", "repl", "net", "tui", "async-tui"]
# The crossterm fork is generated by crossterm-wasi/setup.sh and patched in below.
exclude = ["crossterm-wasi"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# The same crossterm fork codex pins (openai-oss-forks/crossterm), plus the
# wasi backend from crossterm-wasi/. See README.md.
[patch.crates-io]
crossterm = { path = "crossterm-wasi/crossterm" }
