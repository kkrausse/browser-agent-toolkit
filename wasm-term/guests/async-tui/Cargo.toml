[package]
name = "async-tui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# The same stack as the codex TUI: ratatui + crossterm EventStream + tokio.
crossterm = { version = "0.29.0", features = ["bracketed-paste", "event-stream"] }
futures-util = { version = "0.3", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "net"] }
wasm-term-tokio = { path = "../wasm-term-tokio" }
