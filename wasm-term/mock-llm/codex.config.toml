# The app-server's config inside the codex container (copied to ~/.codex/config.toml
# by docker/entrypoint.sh). No credentials: the provider needs none and points at
# the mock container.
model = "mock-model"
model_provider = "mock"
model_reasoning_summary = "auto"

# No codex sandbox: it is bubblewrap-only in 0.162 and bubblewrap cannot create a
# user namespace under Docker's default seccomp/AppArmor confinement, which is
# deliberately left in place. The container is the sandbox. These two are only
# defaults: the client sends its own approvalPolicy and sandbox with each thread
# and turn (see codex.client.config.toml and the README).
approval_policy = "on-request"
sandbox_mode = "danger-full-access"

check_for_update_on_startup = false

# Off because each one phones home at startup (observed via the egress trap):
# plugins -> git ls-remote github.com/openai/plugins, api.github.com, chatgpt.com/backend-api/plugins/*
# apps    -> chatgpt.com connectors directory
[features]
plugins = false
remote_plugin = false
plugin_sharing = false
apps = false

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"

[model_providers.mock]
name = "Mock LLM"
base_url = "http://mock:4791/v1"
wire_api = "responses"
requires_openai_auth = false
