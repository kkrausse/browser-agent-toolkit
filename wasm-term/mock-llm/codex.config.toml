# Template for the isolated CODEX_HOME (copied to .state/codex/config.toml by
# run-codex-server.sh). No credentials: the provider needs none and points at mock-llm.
model = "mock-model"
model_provider = "mock"
model_reasoning_summary = "auto"

# The model asks for approval when it wants to leave the sandbox (the mock's
# `escalate` scenario does). `-c approval_policy="never"` skips all prompts.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

check_for_update_on_startup = false

# Off because each one phones home at startup (observed via the egress trap):
# plugins -> git ls-remote github.com/openai/plugins, api.github.com, chatgpt.com/backend-api/plugins/*
# apps    -> chatgpt.com connectors directory
[features]
plugins = false
remote_plugin = false
plugin_sharing = false
apps = false

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"

[model_providers.mock]
name = "Mock LLM"
base_url = "http://127.0.0.1:4791/v1"
wire_api = "responses"
requires_openai_auth = false
