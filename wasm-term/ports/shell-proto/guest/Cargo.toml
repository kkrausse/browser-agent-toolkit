# The prototype's test program: an ordinary wasm-term guest (wasm32-wasip1, std,
# the wasm-term-sys bindings). Its own workspace so it does not join guests/.
[package]
name = "shell-proto-guest"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
wasm-term-sys = { path = "../../../guests/wasm-term-sys" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
