# The browser build of the codex TUI: a remote-only `main` for wasm32-wasip1 on
# the wasm-term guest ABI. It is a member of the patched codex workspace
# (vendor/codex/codex-rs), which is where its lockfile, lints, [patch] table and
# build profile come from; the source lives here so it is not a patch.
[package]
name = "codex-wasm-term"
version = "0.162.0"
edition = "2024"
license = "Apache-2.0"
publish = false
workspace = "../../../vendor/codex/codex-rs"

[[bin]]
name = "codex-wasm-term"
path = "src/main.rs"

# The same TUI with the embedded app-server and agent core linked in (`?guest=codex-local`).
[[bin]]
name = "codex-wasm-term-local"
path = "src/local.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-app-server-client = { workspace = true }
codex-arg0 = { workspace = true }
codex-build-info = { workspace = true }
codex-config = { workspace = true }
codex-http-client = { workspace = true }
codex-tui = { workspace = true }
codex-utils-cli = { workspace = true }
codex-utils-pty = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "sync"] }

# The host's child processes (`proc_*`): what src/shell.rs runs commands on.
[target.'cfg(target_os = "wasi")'.dependencies]
wasm-term-tokio = { path = "../../../guests/wasm-term-tokio" }
