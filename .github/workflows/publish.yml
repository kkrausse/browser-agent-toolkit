name: Publish packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact new package version (first experimental release: 0.1.0-alpha.1)'
        required: true
        type: string
      verify_only:
        description: Install and check an already published version without rebuilding or publishing
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-packages
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://npm.pkg.github.com
          scope: '@kkrausse'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust and wasm-pack
        run: |
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip1
          cargo install wasm-pack --version 0.13.1 --locked
      - name: Set up pinned runtime source
        run: bun vivari/scripts/setup-runtime.ts
      - name: Download and verify pinned prepared OpenCode
        run: bun scripts/setup-opencode.ts
      - name: Build, stage, pack and smoke
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun scripts/release.ts "$RELEASE_VERSION"
      - name: Retain tested tarballs and provenance
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ inputs.version }}
          path: |
            .release/*/*.tgz
            .release/*/release.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Publish tested tarballs to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bun -e '
            const {artifacts, publishable, sourceDirty} = await Bun.file(`.release/${process.env.RELEASE_VERSION}/release.json`).json();
            if (!publishable || sourceDirty) throw Error("Refusing check-only or dirty-source artifacts");
            const tag = process.env.RELEASE_VERSION.includes("-") ? "next" : "latest";
            for (const artifact of artifacts) {
              const child = Bun.spawn(["npm", "publish", `.release/${process.env.RELEASE_VERSION}/${artifact.filename}`, "--registry=https://npm.pkg.github.com", "--access=public", "--tag", tag, "--ignore-scripts"], {stdout:"inherit", stderr:"inherit"});
              if (await child.exited) process.exit(1);
            }
          '
  verify:
    needs: publish
    if: ${{ always() && (inputs.verify_only || needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify installation from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun scripts/verify-registry.ts "$RELEASE_VERSION"
