# The WebAssembly build of bat-tools' esbuild transform. Its own workspace (own lock
# file, own profile, own [patch]) so that none of this leaks into the native build.
[package]
name = "bat-tools-wasm"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bat-tools = { path = ".." }

# oxc_transformer -> oxc_compat -> oxc-browserslist depends on js-sys on every wasm32
# target, for a clock nothing here calls. Same stub as crates/bat-modules/wasm.
[patch.crates-io]
js-sys = { path = "stubs/js-sys" }

# Node 24, fresh processes, n = 9, load average 22 (docs/experiments/2026-10-09-tools.md):
#   "z": 1.23 MB (0.45 MB gzip), compile 5.7 ms, 21 startup transforms 61 ms, warm 0.6 ms  <- chosen
#   "s": 1.86 MB (0.58 MB gzip), compile 7.1 ms, 59 ms, warm 0.4 ms
#   3:   2.28 MB (0.67 MB gzip), compile 9.1 ms, 69 ms, warm 0.5 ms
# Override with CARGO_PROFILE_RELEASE_OPT_LEVEL when running ../build-wasm.sh.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
strip = true
