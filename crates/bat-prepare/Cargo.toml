[package]
name = "bat-prepare"
version = "0.1.0"
edition = "2021"
description = "Native CLI: dependency tree → image, precompiled modules, program scripts"
license = "MIT"

[[bin]]
name = "bat-prepare"
path = "src/main.rs"

[dependencies]
bat-image = { path = "../bat-image" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
