[package]
name = "bat-prepare"
version = "0.1.0"
edition = "2021"
description = "Native CLI: dependency tree → image, precompiled modules, program scripts"
license = "MIT"

[[bin]]
name = "bat-prepare"
path = "src/main.rs"

[features]
default = ["modules"]
# Precompile modules with bat-modules while packing. Without it the image carries
# no compiled bodies and no program scripts are emitted.
modules = ["dep:bat-modules"]

[dependencies]
bat-image = { path = "../bat-image" }
bat-modules = { path = "../bat-modules", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zstd = { version = "0.13", features = ["zstdmt"] }
