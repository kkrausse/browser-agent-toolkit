[package]
name = "bat-modules"
version = "0.1.0"
edition = "2021"
description = "Module transform (ESM/CJS/TS/JSX -> loader function bodies) and module facts"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_parser = "0.153.0"
oxc_semantic = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
oxc_transformer = "0.153.0"
oxc_codegen = "0.153.0"
oxc_sourcemap = "9"
oxc_diagnostics = "0.153.0"
oxc_ecmascript = "0.153.0"

# Only the command-line tool uses these; the library (and the Wasm build) does not.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"
